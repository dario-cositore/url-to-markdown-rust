[package]
name = "url-to-markdown"
version = "0.1.0"
edition = "2021"
description = "A fast CLI tool to convert webpages to Markdown"
license = "MIT"
repository = "https://github.com/dario-cositore/url-to-markdown-rust"
keywords = ["markdown", "html", "converter", "cli", "webpage"]
categories = ["command-line-utilities", "text-processing"]

[dependencies]
reqwest = { version = "0.12", features = ["rustls-tls"], default-features = false }
tokio = { version = "1", features = ["full"] }
html2md = "0.2"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
url = "2"
